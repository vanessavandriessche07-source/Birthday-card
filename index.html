*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  min-height:100dvh;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#4a3320;
  background-color:#c8a56f;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38 0 0 0 0 .24 0 0 0 0 .1 0 0 0 .38 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 30% 20%,rgba(255,236,196,.55),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(120,80,40,.35),transparent 60%);
}
.stage{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(7vh + var(--safe-t)) 12px calc(4vh + var(--safe-b));gap:clamp(18px,4vh,34px)}
.book{position:relative;width:calc(var(--w)*2);height:var(--h);perspective:2200px;
  transform:scale(var(--s,1)) translateX(calc(var(--w)*-.5));
  transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.book.open{transform:scale(1) translateX(0)}
.page,.face{width:var(--w);height:var(--h);position:absolute;top:0;overflow:hidden;background:var(--navy)}
.page img.fill,.face img.fill{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.right{left:var(--w);border-radius:0 3px 3px 0;box-shadow:0 18px 40px rgba(60,35,10,.45)}
.right::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 9%)}
.leaf{position:absolute;left:var(--w);top:0;width:var(--w);height:var(--h);transform-origin:left center;
  transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.book.open .leaf{transform:rotateY(-180deg)}
.face{left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{border-radius:0 3px 3px 0;cursor:pointer;box-shadow:0 18px 40px rgba(60,35,10,.5)}
.book.open .front{pointer-events:none}
.back{transform:rotateY(180deg);border-radius:3px 0 0 3px}
.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.45),transparent 9%);z-index:9}
.back::before{content:"";position:absolute;inset:calc(var(--u)*3);border:1.5px solid var(--gold);opacity:.8;pointer-events:none}
.tape{position:absolute;width:calc(var(--u)*24);height:calc(var(--u)*7);background:rgba(240,232,160,.8);box-shadow:0 1px 2px rgba(0,0,0,.3);
  clip-path:polygon(2% 0,100% 6%,97% 100%,0 92%);z-index:8}
.tape.a{left:calc(var(--u)*-4);top:calc(var(--u)*6);transform:rotate(-38deg)}
.tape.b{right:calc(var(--u)*-5);bottom:calc(var(--u)*9);transform:rotate(-38deg);background:rgba(150,185,240,.8)}
.piece{position:absolute}
.flap{left:calc(var(--u)*8);top:calc(var(--u)*31.8);width:calc(var(--u)*84);height:calc(var(--u)*30.5);z-index:1;
  background:var(--blue) #2f6296;background-size:calc(var(--u)*40);filter:brightness(.72);clip-path:polygon(0 100%,50% 0,100% 100%)}
.envback{left:calc(var(--u)*8);top:calc(var(--u)*54.5);width:calc(var(--u)*84);height:calc(var(--u)*60);z-index:1;
  background:var(--blue) #2f6296;background-size:calc(var(--u)*40);filter:brightness(.6)}
.envfront{left:calc(var(--u)*8);top:calc(var(--u)*54.5);width:calc(var(--u)*84);height:calc(var(--u)*60);z-index:3;pointer-events:none;
  background:var(--blue) #3a74ad;background-size:calc(var(--u)*40);
  clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);filter:drop-shadow(0 -2px 3px rgba(0,0,0,.3))}
.letter{left:calc(var(--u)*19);top:calc(var(--u)*34.1);width:calc(var(--u)*62);height:calc(var(--u)*80.4);z-index:2;
  border:0;padding:0;background:#e9e2d5;cursor:pointer;transform:rotate(1.2deg);transform-origin:center;
  box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .7s cubic-bezier(.3,.8,.3,1),box-shadow .7s,z-index 0s linear .7s}
.letter img{width:100%;height:100%;display:block;pointer-events:none}
.letter:hover{transform:rotate(1.2deg) translateY(calc(var(--u)*-2))}
.letter.lifted{z-index:5;transform:rotate(-.8deg) scale(1.4);box-shadow:0 12px 34px rgba(0,0,0,.65);transition:transform .7s cubic-bezier(.3,.8,.3,1),box-shadow .7s,z-index 0s}
.hint{position:absolute;left:0;right:0;top:calc(var(--u)*123);text-align:center;z-index:4;color:var(--gold);font-style:italic;
  font-size:clamp(11px,calc(var(--u)*3.6),20px);transition:opacity .4s}
.hint.gone{opacity:0}
.note{font-style:italic;font-size:clamp(13px,2.2vmin,17px);text-align:center;min-height:1.4em;transition:opacity .5s;opacity:.85}
.btn{font:inherit;font-size:15px;padding:.6em 1.3em;border:1.5px solid #3a2a1a;border-radius:2px;background:#f1e3c4;color:#3a2a1a;cursor:pointer;
  box-shadow:2px 3px 0 rgba(58,42,26,.55);transition:opacity .5s,transform .15s,box-shadow .15s}

      back=document.getElementById('back'),note=document.getElementById('note');
  function fit(){
    var w=book.offsetWidth/2,h=book.offsetHeight;
    var s=Math.max(1,Math.min(.86*innerWidth/w,.74*innerHeight/h,1.6));
    book.style.setProperty('--s',s.toFixed(3));
  }
  function setLetter(on){
    letter.classList.toggle('lifted',on);letter.setAttribute('aria-expanded',on);
    hint.classList.toggle('gone',on);
  }
  function setOpen(on){
    book.classList.toggle('open',on);
    back.classList.toggle('hide',!on);
    note.style.opacity=on?0:.85;
    cover.tabIndex=on?-1:0;
    if(!on)setLetter(false);
  }
  cover.addEventListener('click',function(){setOpen(true)});
  cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(true)}});
  back.addEventListener('click',function(){setOpen(false)});
  letter.addEventListener('click',function(){setLetter(!letter.classList.contains('lifted'))});
  addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
